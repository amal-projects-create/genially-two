<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seasons Mnemonic Fun!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a8e6cf, #dcedc1);
            background-image: url('https://www.metoffice.gov.uk/binaries/content/gallery/metofficegovuk/hero-images/weather/seasonal/four-seasons-in-one-picture.jpg');
            background-size: cover;
            background-position: center;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 650px;
            /* Slightly wider to accommodate example */
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            transform: scale(1);
            transform-origin: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @media (max-width: 600px) {
            .container {
                transform: scale(0.95);
                padding: 20px;
            }
        }

        h1 {
            font-family: 'Comic Neue', cursive;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #2c5282;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        p {
            color: #4a5568;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .mnemonic-example {
            background: rgba(66, 153, 225, 0.1);
            color: #2c5282;
            padding: 12px 15px;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            font-size: 0.95rem;
            max-width: 90%;
            border: 1px solid rgba(66, 153, 225, 0.2);
            font-weight: 600;
        }

        .mnemonic-example b {
            color: #3182ce;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .blank {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 15px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .blank:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .season-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        input.word {
            width: 90%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #cbd5e0;
            background: #f7fafc;
            color: #2d3748;
            text-align: center;
            outline: none;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        input.word:focus {
            background: #fff;
            border-color: #4299e1;
        }

        .indicator {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform: scale(0);
            opacity: 0;
        }

        .indicator.ok {
            background: #48bb78;
            transform: scale(1);
            opacity: 1;
        }

        .indicator.bad {
            background: #f56565;
            transform: scale(1);
            opacity: 1;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .btn-check {
            background: linear-gradient(45deg, #4299e1, #3182ce);
            color: #fff;
        }

        .btn-reveal {
            background: #a0aec0;
            color: #fff;
        }

        .btn-reset {
            background: #f7fafc;
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }

        .result {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #2c5282;
            font-weight: 600;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My Seasons Helper!</h1>
        <p>Let's learn the seasons! Type a word for each picture that starts with the right letter.</p>

        <div class="mnemonic-example">
            💡 Example: "<b>S</b>illy <b>S</b>quirrels <b>A</b>te <b>W</b>alnuts"
        </div>

        <div class="grid" id="blanks"></div>

        <div class="buttons">
            <button class="btn-check" id="checkBtn">Check My Words</button>
            <button class="btn-reveal" id="revealBtn">Show Me</button>
            <button class="btn-reset" id="resetBtn">Start Over</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const SEASONS = [{
                name: 'Spring',
                letter: 'S',
                icon: '🌸'
            },
            {
                name: 'Summer',
                letter: 'S',
                icon: '☀️'
            },
            {
                name: 'Autumn',
                letter: 'A',
                icon: '🍁'
            },
            {
                name: 'Winter',
                letter: 'W',
                icon: '❄️'
            }
        ];

        const blanks = document.getElementById('blanks');
        const checkBtn = document.getElementById('checkBtn');
        const revealBtn = document.getElementById('revealBtn');
        const resetBtn = document.getElementById('resetBtn');
        const result = document.getElementById('result');

        function createBlanks() {
            blanks.innerHTML = ''; // Clear existing blanks
            SEASONS.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'blank';
                div.innerHTML = `
          <div class="season-icon">${s.icon}</div>
          <input class="word" placeholder="Starts with ${s.letter}" data-index="${i}" autocomplete="off">
          <div class="indicator"></div>
        `;
                blanks.appendChild(div);
            });
        }

        function normalize(str) {
            return str.trim().charAt(0).toUpperCase();
        }

        function check() {
            let correct = 0;
            const inputs = document.querySelectorAll('.word');
            let allWords = [];
            inputs.forEach((inp, i) => {
                const first = normalize(inp.value);
                const expected = SEASONS[i].letter;
                const ind = inp.parentElement.querySelector('.indicator');
                allWords.push(inp.value.trim());

                if (first === expected) {
                    ind.textContent = '✓';
                    ind.className = 'indicator ok';
                    correct++;
                } else if (inp.value.trim() !== '') {
                    ind.textContent = '✕';
                    ind.className = 'indicator bad';
                } else {
                    ind.className = 'indicator';
                }
            });
            if (correct === SEASONS.length) {
                result.textContent = `Great job! "${allWords.join(' ')}"`;
            } else if (inputs.length > 0 && Array.from(inputs).some(inp => inp.value.trim() !== '')) {
                result.textContent = `Keep trying! ${correct} / ${SEASONS.length} words are correct.`;
            } else {
                result.textContent = '';
            }
        }

        function reveal() {
            const inputs = document.querySelectorAll('.word');
            inputs.forEach((inp, i) => {
                inp.value = SEASONS[i].name;
                const ind = inp.parentElement.querySelector('.indicator');
                ind.textContent = '✓';
                ind.className = 'indicator ok';
            });
            result.textContent = 'Here are the four seasons!';
        }

        function reset() {
            createBlanks();
            result.textContent = '';
        }

        // Initial setup
        createBlanks();

        checkBtn.addEventListener('click', check);
        revealBtn.addEventListener('click', reveal);
        resetBtn.addEventListener('click', reset);

        blanks.addEventListener('keyup', (e) => {
            if (e.target.classList.contains('word')) {
                check();
            }
        });
    </script>
</body>

</html>
